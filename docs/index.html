<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matthew’s Sandbox — pixel edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
:root{
  --panel:#fff7e6; --ink:#2a2233; --sel:#ffd23f; --hot:#ff6b4a; --muted:#6b5f73; --chip:#ffeccc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#2a2233; --ink:#fff4dc; --sel:#d9a91f; --hot:#e8573a; --muted:#c9bcd4; --chip:#3a3046; }
}
:root[data-theme="dark"]{ --panel:#2a2233; --ink:#fff4dc; --sel:#d9a91f; --hot:#e8573a; --muted:#c9bcd4; --chip:#3a3046; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--panel);color:var(--ink);font-family:"Pixelify Sans",ui-monospace,"Courier New",monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#stage{position:relative;flex:1;min-height:0;background:#cfe8e4}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;image-rendering:pixelated}
#title{position:absolute;top:8px;left:10px;font-size:26px;font-weight:700;color:#2a2233;text-shadow:3px 3px 0 #fff;pointer-events:none;line-height:1}
#top{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.pb{font:inherit;font-weight:700;font-size:16px;background:var(--panel);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.25);padding:4px 10px;cursor:pointer;line-height:1.1}
.pb:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.pb.on{background:var(--sel)}
.pb:focus-visible,.slot:focus-visible{outline:3px dashed var(--hot);outline-offset:2px}
#toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);font-size:20px;font-weight:700;color:#2a2233;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#dock{border-top:4px solid var(--ink);background:var(--panel);padding:6px 8px 8px}
#tabs{display:flex;gap:6px;margin-bottom:6px}
#tabs .pb{font-size:15px;padding:2px 12px;box-shadow:none}
#slots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#slots::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--chip);border:4px solid var(--ink);cursor:pointer;padding:0}
.slot img{width:40px;height:40px;image-rendering:pixelated;object-fit:contain}
.slot.on{background:var(--hot);color:#fff}
.sheet{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,14,30,.55);padding:10px;z-index:5}
.sheet.show{display:flex}
.card{background:var(--panel);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.3);width:min(720px,100%);max-height:100%;overflow:auto;padding:12px 14px}
.card h2{margin:0 0 8px;font-size:24px}
.mk{display:flex;gap:16px;align-items:flex-start}
#mkPrev{width:130px;height:252px;image-rendering:pixelated;flex:0 0 auto;background:#cfe8e4;border:4px solid var(--ink)}
#mkRows{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.row label{flex:0 0 118px;font-size:15px;color:var(--muted);font-weight:700}
.row .val{flex:0 0 110px;height:30px;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.row .pb{padding:0 10px;height:30px;box-shadow:none}
#mkName{font:inherit;font-size:17px;font-weight:700;border:4px solid var(--ink);background:var(--chip);color:var(--ink);padding:2px 8px;width:100%}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.stages{display:flex;gap:8px;flex-wrap:wrap}
.stages button{width:118px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.stages img{width:96px;height:60px;image-rendering:pixelated;border:3px solid var(--ink)}
@media (max-height:520px){ .slot{width:62px;height:62px;font-size:11px} .slot img{width:30px;height:30px} #title{font-size:20px} .pb{font-size:14px} }
@media (max-width:560px){ #title{font-size:18px;top:46px} }
@media (max-width:520px){ .mk{flex-direction:column;align-items:center} #mkPrev{width:104px;height:202px} .row label{flex-basis:96px} .row .val{flex-basis:90px} }
@media (prefers-reduced-motion: reduce){ #toast{transition:none} .pb:active{transform:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="title">Matthew’s Sandbox</div>
    <div id="top">
      <button class="pb" id="bStage">Stage</button>
      <button class="pb" id="bSound">Sound: on</button>
      <button class="pb" id="bClear">Clear</button>
    </div>
    <div id="toast"></div>
    <div class="sheet" id="stageSheet"><div class="card"><h2>Pick a stage</h2><div class="stages" id="stageList"></div><div class="foot"><button class="pb" data-close>Close</button></div></div></div>
    <div class="sheet" id="makerSheet"><div class="card">
      <h2>Make a character</h2>
      <div class="mk"><canvas id="mkPrev" width="16" height="31"></canvas>
        <div id="mkRows"><div class="row"><label for="mkName">Name</label><input id="mkName" maxlength="12"></div><div id="mkOpts"></div></div></div>
      <div class="foot"><button class="pb" id="mkRandom">Random</button><button class="pb" id="mkDelete">Delete</button><button class="pb" data-close>Cancel</button><button class="pb on" id="mkSave">Save</button></div>
    </div></div>
  </div>
  <div id="dock">
    <div id="tabs"><button class="pb" data-tab="people">People</button><button class="pb" data-tab="things">Things</button><button class="pb" data-tab="tools">Tools</button></div>
    <div id="slots"></div>
  </div>
</div>
<script>
(function(){
const {Engine, Bodies, Body, Composite, Constraint, Query, Events, Vector} = Matter;

// ============ pixel art ============
const SKINS=["#ffdbb5","#f1c27d","#e0ac69","#c68642","#8d5524","#5c3a21"];
const HAIR_COLS=["#2b1d14","#5a3825","#a0522d","#e8701e","#f4c542","#9e9e9e","#d95b8a","#3b6fd6"];
const CLOTH=["#e84a4a","#f59e2b","#f7d43c","#4cbf56","#2fb0a8","#3b82f6","#6c4ad6","#e86aa8","#ffffff","#3a3f4a","#8b5a2b","#9aa4b0"];
const SHOES=["#3a3f4a","#e84a4a","#3b82f6","#ffffff","#8b5a2b","#f59e2b"];
const HAIRS=["short","spiky","bob","long","pigtails","cap","curly","bald"];
const TOPS=["tee","vest","overalls","dress","checker","stripes","hoodie"];
const BOTTOMS=["pants","shorts","skirt"], SLEEVES=["short","long","none"], SIZES=[0.75,1,1.35];
const NAMES=["Max","Zoe","Leo","Mia","Bolt","Pip","Rex","Luna","Kiko","Taro","Nala","Ziggy","Ana","Jojo","Bea","Migs"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function dark(h,f=0.78){ const [r,g,b]=hex2rgb(h); return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`; }
function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.imageSmoothingEnabled=false; c.x=x; return c; }
function R(c,x,y,w,h,col){ c.x.fillStyle=col; c.x.fillRect(x,y,w,h); }
function P(c,x,y,col){ R(c,x,y,1,1,col); }
function disc(c,cx,cy,r,col){ for(let y=0;y<c.height;y++) for(let x=0;x<c.width;x++) if((x+.5-cx)**2+(y+.5-cy)**2<=r*r) P(c,x,y,col); }

function randomSpec(){ const r=Math.random(); return {name:pick(NAMES),skin:pick(SKINS),hair:pick(HAIRS),hair_col:pick(HAIR_COLS),top:pick(TOPS),top_col:pick(CLOTH),top_col2:pick(CLOTH),sleeves:pick(SLEEVES),bottom:pick(BOTTOMS),bot_col:pick(CLOTH),shoe_col:pick(SHOES),size:r<0.15?0.75:r>0.85?1.35:1}; }
function dummySpec(){ return {name:"Dummy",skin:"#f7d43c",hair:"bald",hair_col:"#2b1d14",top:"tee",top_col:"#f7d43c",top_col2:"#3a3f4a",sleeves:"none",bottom:"pants",bot_col:"#f7d43c",shoe_col:"#3a3f4a",size:1,dummy:true}; }
const isDress=sp=>sp.top==="dress"||sp.top==="checker";

function headImg(sp,face){
  const c=cv(12,14), hc=sp.hair_col, hs=sp.hair, skin=sp.skin;
  if(hs==="long") R(c,1,3,10,11,hc); else if(hs==="bob") R(c,1,3,10,8,hc); else if(hs==="curly") R(c,1,2,10,6,hc);
  else if(hs==="pigtails"){ R(c,0,5,2,5,hc); R(c,10,5,2,5,hc); P(c,1,5,"#e84a4a"); P(c,10,5,"#e84a4a"); }
  R(c,2,3,8,8,skin); R(c,9,3,1,8,dark(skin,0.9));
  if(sp.dummy){ P(c,2,4,"#3a3f4a"); P(c,9,4,"#3a3f4a"); }
  switch(hs){
    case "short": R(c,2,1,8,3,hc); P(c,2,4,hc); P(c,9,4,hc); break;
    case "spiky": R(c,2,2,8,2,hc); [2,4,7,9].forEach(x=>P(c,x,1,hc)); P(c,4,0,hc); P(c,7,0,hc); P(c,2,4,hc); P(c,9,4,hc); break;
    case "bob": R(c,2,1,8,3,hc); R(c,1,2,1,8,hc); R(c,10,2,1,8,hc); break;
    case "long": R(c,2,1,8,3,hc); R(c,1,2,1,9,hc); R(c,10,2,1,9,hc); break;
    case "pigtails": R(c,2,1,8,3,hc); P(c,2,4,hc); P(c,9,4,hc); break;
    case "cap": R(c,2,0,8,3,sp.top_col2); R(c,1,3,11,1,dark(sp.top_col2)); P(c,5,1,"#ffffff"); P(c,2,4,hc); P(c,9,4,hc); break;
    case "curly": for(let x=1;x<11;x+=2) P(c,x,0,hc); R(c,1,1,10,3,hc); R(c,1,4,1,2,hc); R(c,10,4,1,2,hc); break;
    case "bald": P(c,3,3,"rgba(255,255,255,.35)"); break;
  }
  const ink="#222222", lip="#b03a3a";
  if(face==="n"){ P(c,4,6,ink); P(c,7,6,ink); P(c,4,8,lip); P(c,7,8,lip); R(c,5,9,2,1,lip); }
  else if(face==="b"){ R(c,3,6,2,1,ink); R(c,7,6,2,1,ink); R(c,5,9,2,1,lip); }
  else if(face==="o"){ R(c,3,6,2,1,ink); R(c,7,6,2,1,ink); R(c,5,8,2,2,ink); }
  else { [[3,5],[5,5],[4,6],[3,7],[5,7],[6,5],[8,5],[7,6],[6,7],[8,7]].forEach(d=>P(c,d[0],d[1],ink)); R(c,5,9,2,1,ink); }
  if(face!=="k"){ P(c,3,8,"rgba(255,128,128,.55)"); P(c,8,8,"rgba(255,128,128,.55)"); }
  return c;
}
function torsoImg(sp){
  const c=cv(8,9), t=sp.top_col, t2=sp.top_col2, b=sp.bot_col;
  switch(sp.top){
    case "vest": R(c,0,0,8,9,t); R(c,0,0,2,9,t2); R(c,6,0,2,9,t2); break;
    case "overalls": R(c,0,0,8,9,t); R(c,2,3,4,6,b); R(c,2,0,1,3,b); R(c,5,0,1,3,b); P(c,2,3,"#ffd23f"); P(c,5,3,"#ffd23f"); break;
    case "dress": R(c,0,0,8,9,t); R(c,0,5,8,1,t2); break;
    case "checker": for(let y=0;y<9;y++) for(let x=0;x<8;x++) P(c,x,y,(x+y)%2?dark(t,0.8):t); break;
    case "stripes": for(let y=0;y<9;y++) R(c,0,y,8,1,y%2?t2:t); break;
    case "hoodie": R(c,0,0,8,9,t); R(c,3,1,2,3,dark(t,0.7)); R(c,2,6,4,2,dark(t,0.85)); break;
    default: R(c,0,0,8,9,t);
  }
  if(sp.dummy){ R(c,3,2,2,2,"#3a3f4a"); P(c,3,2,"#ffffff"); P(c,4,3,"#ffffff"); }
  R(c,3,0,2,1,sp.skin);
  if(["tee","vest","stripes","hoodie"].includes(sp.top)) R(c,0,8,8,1,b);
  R(c,7,0,1,9,"rgba(0,0,0,.12)");
  return c;
}
function uarmImg(sp){ const c=cv(2,5); const col=(sp.sleeves==="none"||(isDress(sp)&&sp.sleeves!=="long"))?sp.skin:sp.top_col; R(c,0,0,2,5,col); R(c,1,0,1,5,"rgba(0,0,0,.1)"); return c; }
function larmImg(sp){ const c=cv(2,5); R(c,0,0,2,3,sp.sleeves==="long"?sp.top_col:sp.skin); R(c,0,3,2,2,sp.skin); R(c,1,0,1,5,"rgba(0,0,0,.1)"); return c; }
function thighImg(sp){ const c=cv(3,5);
  if(isDress(sp)){ R(c,0,0,3,5,sp.skin); R(c,0,0,3,3,sp.top_col); }
  else if(sp.bottom==="skirt"&&sp.top!=="overalls"){ R(c,0,0,3,5,sp.skin); R(c,0,0,3,3,sp.bot_col); }
  else R(c,0,0,3,5,sp.bot_col);
  R(c,2,0,1,5,"rgba(0,0,0,.1)"); return c; }
function shinImg(sp){ const c=cv(3,6); const long=(sp.bottom==="pants"&&!isDress(sp))||sp.top==="overalls"; R(c,0,0,3,4,long?sp.bot_col:sp.skin); R(c,0,4,3,2,sp.shoe_col); R(c,0,5,3,1,dark(sp.shoe_col,0.7)); return c; }
function fullImg(sp){ const c=cv(16,31); const t=thighImg(sp), s=shinImg(sp), u=uarmImg(sp), l=larmImg(sp);
  [[t,4,20],[t,9,20],[s,4,25],[s,9,25],[torsoImg(sp),4,11],[u,2,11],[u,12,11],[l,2,16],[l,12,16],[headImg(sp,"n"),2,0]].forEach(p=>c.x.drawImage(p[0],p[1],p[2])); return c; }

function itemImg(kind,hue=0){
  let c;
  switch(kind){
    case "crate": c=cv(12,12); R(c,0,0,12,12,"#c8894a"); R(c,0,0,12,1,"#7a4f24"); R(c,0,11,12,1,"#7a4f24"); R(c,0,0,1,12,"#7a4f24"); R(c,11,0,1,12,"#7a4f24"); for(let k=1;k<11;k++){ P(c,k,k,"#8e5d2c"); P(c,k,11-k,"#a8723c"); } break;
    case "steel": c=cv(10,10); R(c,0,0,10,10,"#9aa6b2"); R(c,0,9,10,1,"#545f6b"); R(c,9,0,1,10,"#545f6b"); R(c,1,1,8,1,"#c8d0d8"); [[2,2],[7,2],[2,7],[7,7]].forEach(d=>P(c,d[0],d[1],"#5f6b77")); break;
    case "ball": c=cv(9,9); disc(c,4.5,4.5,4.5,"#ef4b4b"); { const tmp=cv(9,9); disc(tmp,4.5,4.5,4.5,"#f7f7f2"); c.x.drawImage(tmp,0,5,9,4,0,5,9,4); const ln=cv(9,9); disc(ln,4.5,4.5,4.5,"#2a2233"); c.x.drawImage(ln,0,4,9,1,0,4,9,1); } P(c,2,2,"#ffffff"); break;
    case "bowling": c=cv(10,10); disc(c,5,5,5,"#2b3f8c"); [[3,3],[5,2],[4,5]].forEach(d=>P(c,d[0],d[1],"#0d1533")); P(c,7,6,"#5c74c8"); break;
    case "tnt": c=cv(8,11); R(c,0,1,8,10,"#d8312a"); R(c,0,4,8,3,"#f4e3c3"); R(c,1,5,6,1,"#7a1410"); R(c,7,1,1,10,"#a32218"); P(c,4,0,"#3a2a1a"); P(c,5,0,"#3a2a1a"); break;
    case "balloon": { c=cv(8,11); const bc=`hsl(${Math.round(hue*360)} 75% 58%)`; disc(c,4,4.5,4.2,bc); P(c,2,2,"#ffffff"); P(c,2,3,"rgba(255,255,255,.6)"); P(c,4,9,`hsl(${Math.round(hue*360)} 70% 40%)`); P(c,4,10,"#888888"); break; }
    case "plank": c=cv(40,4); R(c,0,0,40,4,"#d9a066"); R(c,0,3,40,1,"#8a5a2b"); R(c,3,1,14,1,"#b07a43"); R(c,22,2,12,1,"#b07a43"); break;
    case "brick": c=cv(12,6); R(c,0,0,12,6,"#c4533a"); R(c,0,3,12,1,"#e8b4a4"); R(c,4,1,1,2,"#e8b4a4"); R(c,8,4,1,2,"#e8b4a4"); break;
    case "duck": c=cv(10,9); R(c,1,4,8,4,"#ffd23f"); R(c,0,5,1,2,"#ffd23f"); R(c,5,1,4,4,"#ffd23f"); P(c,7,2,"#1f2a33"); P(c,9,3,"#ff8c32"); R(c,2,5,3,2,"#e6b800"); R(c,1,8,8,1,"#c99700"); break;
    case "tramp": c=cv(28,7); R(c,0,1,28,2,"#ff5a7a"); R(c,1,0,26,1,"#3aa0ff"); for(let x=3;x<26;x+=5) P(c,x,2,"#ffd23f"); R(c,2,3,1,4,"#5b6573"); R(c,25,3,1,4,"#5b6573"); break;
    default: c=cv(8,8); R(c,0,0,8,8,"#999");
  }
  return c;
}
function icon(name){
  const c=cv(12,12), ink="#2a2233";
  switch(name){
    case "drag": R(c,3,4,7,6,"#ffcf9e"); [3,5,7].forEach(x=>R(c,x,1,2,4,"#ffcf9e")); R(c,10,5,1,3,"#ffcf9e"); R(c,3,10,7,1,ink); break;
    case "poke": R(c,5,1,2,6,"#ffcf9e"); R(c,3,6,7,5,"#ffcf9e"); R(c,3,11,7,1,ink); break;
    case "boom": disc(c,6,7,4.5,ink); P(c,8,2,"#ffd23f"); P(c,9,1,"#ff8c32"); P(c,4,5,"#8a8a9a"); break;
    case "heal": R(c,2,3,3,4,"#ff4d6d"); R(c,7,3,3,4,"#ff4d6d"); R(c,2,5,8,2,"#ff4d6d"); R(c,3,7,6,2,"#ff4d6d"); R(c,5,9,2,1,"#ff4d6d"); P(c,3,4,"#fff"); break;
    case "del": for(let k=0;k<10;k++){ P(c,k+1,k+1,"#e84a4a"); P(c,k+2,k+1,"#e84a4a"); P(c,10-k,k+1,"#e84a4a"); P(c,11-k,k+1,"#e84a4a"); } break;
    case "magnet": R(c,2,2,3,7,"#e84a4a"); R(c,7,2,3,7,"#e84a4a"); R(c,2,8,8,2,"#e84a4a"); R(c,2,1,3,2,"#c8d0d8"); R(c,7,1,3,2,"#c8d0d8"); break;
    case "wind": R(c,1,3,8,1,"#5ab8ff"); R(c,2,6,9,1,"#5ab8ff"); R(c,1,9,6,1,"#5ab8ff"); P(c,9,2,"#5ab8ff"); P(c,11,5,"#5ab8ff"); break;
    case "grow": R(c,5,3,2,8,"#4cbf56"); R(c,3,5,6,1,"#4cbf56"); R(c,4,4,4,1,"#4cbf56"); R(c,5,2,2,1,"#4cbf56"); break;
    case "shrink": R(c,5,1,2,8,"#f59e2b"); R(c,3,7,6,1,"#f59e2b"); R(c,4,8,4,1,"#f59e2b"); R(c,5,9,2,1,"#f59e2b"); break;

    const grounded=now-r.grounded<120, dragged=pt-r.dragT<300, P=r.parts;
    if(r.alive&&grounded&&!dragged&&g>0.05){ const stun=Math.max(0,1-(pt-r.hurtT)/900), st=(0.35+0.65*r.health/100)*(1-stun*0.8);
      ["torso","head","th_l","th_r","sh_l","sh_r"].forEach(k=>upright(P[k],0.22*st)); ["ua_l","ua_r","la_l","la_r"].forEach(k=>upright(P[k],0.05*st));
      Body.applyForce(P.torso,P.torso.position,{x:0,y:-r.mass*engine.gravity.scale*g*0.55*st}); }
    const lying=Math.abs(wrap(P.torso.angle))>0.8||P.head.position.y>P.torso.position.y-10*r.u;
    if(r.alive&&lying&&now-r.touch<150&&!dragged&&g>0.05){ if(r.downSince<0) r.downSince=pt; else if(pt-r.downSince>1400&&pt-r.getupT>1500){ r.getupT=pt; r.downSince=-1; r.list.forEach(b=>{ Body.setVelocity(b,{x:b.velocity.x*0.3,y:-9*Math.sqrt(g)}); Body.setAngularVelocity(b,-wrap(b.angle)*0.12); }); say(r,pick(["Upsy-daisy!","I'm OK!","Hup!"]),1000); } } else r.downSince=-1;
    if(pt-r.getupT<500) r.list.forEach(b=>upright(b,0.18));
    const v=Vector.magnitude(P.torso.velocity); if(v>14&&!grounded&&pt-r.flyT>2500){ r.flyT=pt; say(r,pick(FLY),1200,true); sfx('whoosh'); }
    if(r.alive&&grounded&&!r.bubble&&Math.random()<0.0007) say(r,pick(IDLE),1500);
  });
  if(hold){ Composite.allBodies(world).forEach(b=>{ if(b.isStatic) return; const d=Vector.sub(hold.p,b.position), dist=Vector.magnitude(d); if(dist>260||dist<1) return; const f=1-dist/260; let v=Vector.add(b.velocity,Vector.mult(d,(hold.type==='magnet'?0.9:-1.2)*f/dist)); if(hold.type==='magnet'&&dist<40) v=Vector.mult(v,0.85); const sp=Vector.magnitude(v); if(sp>16) v=Vector.mult(v,16/sp); Body.setVelocity(b,v); if(b.plugin.rag) b.plugin.rag.dragT=performance.now(); }); }
  for(const b of Composite.allBodies(world)){ const pl=b.plugin||{};
    if(pl.kind==="balloon") Body.applyForce(b,b.position,{x:0,y:-b.mass*engine.gravity.scale*Math.max(g,0.3)*2.3});
    if(pl.fuse&&pt>pl.fuse&&!pl.boomed){ pl.boomed=true; detonate(b); }
    if(b.position.y>WORLD_H+800||b.position.y<-3000){ if(pl.rag) removeRag(pl.rag); else Composite.remove(world,b); } }
}

// ---------- input ----------
function toWorld(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}; }
function bodyAt(p){ const list=Composite.allBodies(world).filter(b=>!statics.includes(b)); let hits=Query.point(list,p); if(!hits.length){ let best=null,bd=22; list.forEach(b=>{ const d=Vector.magnitude(Vector.sub(b.position,p)); if(d<bd){ bd=d; best=b; } }); return best; } hits.sort((a,b)=>((b.plugin&&b.plugin.z)||0)-((a.plugin&&a.plugin.z)||0)); return hits[0]; }
function endDrag(){ if(drag&&drag.c) Composite.remove(world,drag.c); drag=null; }
canvas.addEventListener('pointerdown',e=>{
  if(pointerId!==null) return; pointerId=e.pointerId; canvas.setPointerCapture(e.pointerId); ac();
  const p=toWorld(e);
  if(stage==="lab"&&Math.abs(p.x-machineAt.x)<13*PX&&Math.abs(p.y-machineAt.y)<15*PX){ pullMachine(); return; }
  if(mode.kind==='item'){ makeItem(mode.id,p.x,Math.min(p.y,groundY-30)); sfx('spawn'); return; }
  if(mode.kind==='char'){ const sp=mode.id==='random'?randomSpec():mode.id==='dummy'?dummySpec():chars[+mode.id]; if(!sp) return; const r=makeRag(sp,p.x,Math.min(p.y,groundY-60)); say(r,`Hi! I'm ${sp.name}!`,1600,true); sfx('hi'); if(mode.id==='random'){ lastRandom=sp; buildSlots(); } return; }
  const b=bodyAt(p);
  switch(mode.id){
    case 'drag': if(!b) return; if(b.isStatic){ drag={body:b,static:true}; } else { const c=Constraint.create({pointA:p,bodyB:b,pointB:Vector.sub(p,b.position),length:0,stiffness:b.plugin.rag?0.08:0.18,damping:0.08}); Composite.add(world,c); drag={body:b,c}; } break;
    case 'poke': if(b) poke(b); break;
    case 'boom': explode(p.x,p.y); break;
    case 'heal': if(b&&b.plugin.rag){ const r=b.plugin.rag; r.health=100; r.alive=true; say(r,"Yay!",1400,true); sfx('magic'); burst(b.position.x,b.position.y,12,["#ff6b8a","#ffb3c6"],3,36,6,-0.05); } break;
    case 'del': if(b){ burst(b.position.x,b.position.y,10,["rgba(255,255,255,.9)"],3,20,6,0); sfx('pop'); if(b.plugin.rag) removeRag(b.plugin.rag); else Composite.remove(world,b); } break;
    case 'magnet': case 'wind': hold={type:mode.id,p}; if(mode.id==='wind') sfx('whoosh'); break;
    case 'grow': if(b) resizeThing(b,1.3); break;
    case 'shrink': if(b) resizeThing(b,1/1.3); break;
    case 'copy': if(b) copyThing(b); break;
  }
});
canvas.addEventListener('pointermove',e=>{ if(e.pointerId!==pointerId) return; const p=toWorld(e); if(hold){ hold.p=p; return; } if(!drag) return; if(drag.static) Body.setPosition(drag.body,{x:p.x,y:drag.body.position.y}); else { drag.c.pointA=p; if(drag.body.plugin.rag) drag.body.plugin.rag.dragT=performance.now(); } });
function up(e){ if(e.pointerId!==pointerId) return; pointerId=null; endDrag(); hold=null; }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
function poke(b){
  const pl=b.plugin;
  if(pl.rag){ const r=pl.rag; if(r.alive){ setVY(r,-9); say(r,pick(["Hehe!","Haha!","That tickles!"]),1300,true); sfx('giggle'); } else { say(r,"Zzz",1000,true); toast("Sleeping! Use Heal to wake them up"); } return; }
  switch(pl.kind){
    case "tnt": if(!pl.fuse){ pl.fuse=performance.now()+1500; sfx('fuse'); toast("Fuse lit! Stand back!"); } break;
    case "balloon": pop(b); break;
    case "duck": sfx('squeak'); pl.squeakT=performance.now(); Body.setVelocity(b,{x:b.velocity.x,y:-7}); break;
    case "tramp": sfx('boing'); pl.boingT=performance.now(); break;
    default: if(!b.isStatic){ Body.setVelocity(b,{x:b.velocity.x,y:-6}); sfx('thud'); }
  }
}
function resizeThing(b,k){
  const pl=b.plugin;
  if(pl.rag){ const r=pl.rag, ns=Math.round(Math.max(0.6,Math.min(2.2,r.s*k))*100)/100; if(ns===r.s){ toast(k>1?"That's as big as it gets!":"That's as small as it gets!"); return; } const p={...r.parts.torso.position}; removeRag(r); const nr=makeRag({...r.spec,size:ns},p.x,p.y-10); say(nr,k>1?"I'm huge!":"I'm tiny!",1300,true); }
  else { const ns=Math.max(0.4,Math.min(3,(pl.size||1)*k)); const p={...b.position}; Composite.remove(world,b); makeItem(pl.kind,p.x,p.y-10,ns); }
  sfx('magic');
}
function copyThing(b){ const pl=b.plugin; if(pl.rag){ const r=pl.rag, t=r.parts.torso.position; const nr=makeRag(r.spec,Math.min(W-30,t.x+50*r.s),t.y-30); say(nr,"Twins!",1300,true); } else makeItem(pl.kind,Math.min(W-30,b.position.x+36),b.position.y-36,pl.size||1); sfx('magic'); }

// ---------- random character machine ----------
let lastRandom=null;
function pullMachine(){
  const t=performance.now(); if(t-machineT<1300) return; machineT=t; sfx('machine');
  setTimeout(()=>{ const sp=randomSpec(), out={x:machineAt.x,y:machineAt.y+18*PX}; const r=makeRag(sp,out.x+40,out.y+10); r.list.forEach(b=>Body.setVelocity(b,{x:4.5,y:-3}));
    say(r,`Hi! I'm ${sp.name}!`,2000,true); sfx('fanfare'); burst(out.x,out.y,24,["#ffd23f","#ff7ab6","#5ff5c8","#ffffff"],5,48,6,0.2);
    lastRandom=sp; toast(`Meet ${sp.name}! Tap Keep in People to save them.`); if(tab==='people') buildSlots(); },900);
}

// ---------- render ----------
function drawPart(b,img,u){ ctx.save(); ctx.translate(b.position.x,b.position.y); ctx.rotate(b.angle); ctx.drawImage(img,-img.width*u/2,-img.height*u/2,img.width*u,img.height*u); ctx.restore(); }
function drawRag(r){
  const P=r.parts, now=performance.now();
  let f='n'; if(!r.alive) f='k'; else if(now-r.hurtT<600) f='o'; else if((now+r.seed)%3600<130) f='b';
  ["th_l","th_r","sh_l","sh_r","torso","ua_l","ua_r","la_l","la_r"].forEach(k=>drawPart(P[k],P[k].plugin.img,r.u));
  drawPart(P.head,r.tex[f],r.u);
}
function pixText(txt,x,y,size,col){ ctx.font=`700 ${size}px "Pixelify Sans",monospace`; ctx.fillStyle=col; ctx.fillText(txt,x,y); }
function drawOverlay(r){
  const h=r.parts.head.position, s=r.s, now=performance.now();
  if(!r.alive) for(let k=0;k<3;k++){ const a=now/400+k*2.1; ctx.fillStyle="#ffd23f"; ctx.fillRect(h.x+Math.cos(a)*20*s-3,h.y-26*s+Math.sin(a)*4-3,6,6); }
  if(now-r.hurtT<2000){ const x=h.x-18, y=h.y-30*s-10; ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(x,y,36,6); ctx.fillStyle=r.health>50?"#4ade80":r.health>20?"#facc15":"#f87171"; ctx.fillRect(x,y,36*r.health/100,6); }
  if(r.bubble){ const age=now-r.bubble.t; if(age>r.bubble.d){ r.bubble=null; return; }
    ctx.font='700 18px "Pixelify Sans",monospace'; const w=ctx.measureText(r.bubble.txt).width+20, x=Math.max(4,Math.min(W-w-4,h.x-w/2)), y=h.y-30*s-50;
    ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(x+4,y+4,w,30); ctx.fillStyle="#fff"; ctx.fillRect(x,y,w,30); ctx.strokeStyle="#2a2233"; ctx.lineWidth=3; ctx.strokeRect(x,y,w,30); ctx.fillRect(h.x-4,y+30,8,6);
    ctx.textAlign='left'; ctx.textBaseline='middle'; pixText(r.bubble.txt,x+10,y+16,18,"#2a2233"); }
}
function drawItem(b){
  const pl=b.plugin, s=PX*(pl.size||1), now=performance.now();
  let img=pl.img;
  ctx.save(); ctx.translate(b.position.x,b.position.y); ctx.rotate(b.angle);
  let sy=1; if(pl.kind==="tramp"&&now-(pl.boingT||-1e9)<240) sy=0.6; if(pl.kind==="duck"&&now-(pl.squeakT||-1e9)<160) sy=0.8;
  const dy=pl.kind==="tramp"?-pl.h*0.25:0;
  if(pl.kind==="tnt"&&pl.fuse&&Math.floor(now/120)%2){ ctx.globalAlpha=0.6; }
  ctx.drawImage(img,-img.width*s/2,dy-img.height*s*sy/2+(1-sy)*img.height*s/2,img.width*s,img.height*s*sy);
  ctx.restore();
  if(pl.kind==="balloon"){ const p=Vector.add(b.position,Vector.rotate({x:0,y:22*(pl.size||1)},b.angle)); ctx.strokeStyle="#555"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+4,p.y+14); ctx.lineTo(p.x-3,p.y+26); ctx.lineTo(p.x+2,p.y+38); ctx.stroke(); }
  if(pl.kind==="tnt"&&pl.fuse&&Math.random()<0.5){ const p=Vector.add(b.position,Vector.rotate({x:0,y:-24*(pl.size||1)},b.angle)); burst(p.x,p.y,1,["#ffd23f","#ff8c32"],1.2,14,4,0); }
}
function render(){
  const now=performance.now();
  ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled=false;
  let sx=0,sy=0; if(shake>0.3){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; }
  ctx.setTransform(dpr*scale,0,0,dpr*scale,sx*dpr,sy*dpr); ctx.imageSmoothingEnabled=false;
  if(bgCanvas) ctx.drawImage(bgCanvas,0,0,bgCanvas.width*PX,bgCanvas.height*PX);
  if(stage==="lab"){ const mt=now-machineT, im=mt<1200?MACH[2+Math.floor(now/80)%2]:MACH[Math.floor(now/500)%2]; const jx=mt<1200?(Math.random()-0.5)*3:0; ctx.drawImage(im,machineAt.x-13*PX+jx,machineAt.y-15*PX,26*PX,30*PX); }
  Composite.allBodies(world).forEach(b=>{ if(b.plugin&&b.plugin.kind&&b.plugin.kind!=='static') drawItem(b); });
  rags.forEach(drawRag);
  if(hold){ const ph=(now/600)%1; for(let k=0;k<3;k++){ const f=(ph+k/3)%1, rr=hold.type==='magnet'?260*(1-f):260*f; ctx.strokeStyle=hold.type==='magnet'?"rgba(255,90,90,.5)":"rgba(255,255,255,.6)"; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(hold.p.x,hold.p.y,Math.max(2,rr),0,7); ctx.stroke(); } }
  for(const p of particles){ const t=p.life/p.max; ctx.globalAlpha=1-t; ctx.fillStyle=p.col; const r=p.r*(1-t*0.4); ctx.fillRect(p.x-r/2,p.y-r/2,r,r); } ctx.globalAlpha=1;
  rags.forEach(drawOverlay);
}
function fixJoints(){
  rags.forEach(r=>{
    for(const c of r.joints){
      const A=Vector.add(c.bodyA.position,c.pointA), B=Vector.add(c.bodyB.position,c.pointB), d=Vector.sub(A,B), m=Vector.magnitude(d);
      if(m>1) Body.translate(c.bodyB,Vector.mult(d,(m-1)/m));
    }
    r.list.forEach(b=>{ const v=Vector.magnitude(b.velocity); if(v>30) Body.setVelocity(b,Vector.mult(b.velocity,30/v)); });
  });
}
function stepParticles(){ for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life++; p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy=p.vy*0.95+p.g; if(p.life>=p.max) particles.splice(i,1); } shake*=0.86; }
const STEP=1000/60; let last=performance.now(), acc=0;
function frame(t){ const dt=Math.min(50,t-last); last=t; acc+=dt; let n=0; while(acc>=STEP&&n<4){ tick(); Engine.update(engine,STEP); fixJoints(); stepParticles(); acc-=STEP; n++; } if(n===4) acc=0; render(); requestAnimationFrame(frame); }

// ============ UI ============
let chars=[]; try{ chars=JSON.parse(localStorage.getItem('msp-chars')||'[]'); }catch(e){}
function saveChars(){ try{ localStorage.setItem('msp-chars',JSON.stringify(chars)); }catch(e){} }
const toastEl=document.getElementById('toast'); let toastT;
function toast(t){ toastEl.textContent=t; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1900); }
let tab='people';
const slotsEl=document.getElementById('slots');
function slot(imgCanvas,label,on,fn){ const b=document.createElement('button'); b.className='slot'+(on?' on':''); const im=document.createElement('img'); im.alt=''; im.src=imgCanvas.toDataURL(); b.appendChild(im); const s=document.createElement('span'); s.textContent=label; b.appendChild(s); b.onclick=fn; slotsEl.appendChild(b); }
const TOOLS=[["drag","Drag"],["poke","Poke"],["boom","Boom"],["heal","Heal"],["del","Delete"],["magnet","Magnet"],["wind","Wind"],["grow","Grow"],["shrink","Shrink"],["copy","Copy"]];
const HINTS={drag:"Drag and fling things",poke:"Tickle people, light TNT, pop balloons",boom:"Tap anywhere to blast",heal:"Tap a sleeping friend to wake them",del:"Tap something to remove it",magnet:"Hold your finger down to pull things in",wind:"Hold your finger down to blow things away",grow:"Tap something to make it bigger",shrink:"Tap something to make it smaller",copy:"Tap something to make a twin"};
function buildSlots(){
  slotsEl.innerHTML='';
  document.querySelectorAll('#tabs .pb').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const is=(k,i)=>mode.kind===k&&mode.id===i;
  if(tab==='people'){
    slot(icon('dice'),'Random',is('char','random'),()=>pickMode('char','random'));
    slot(headImg(dummySpec(),'n'),'Dummy',is('char','dummy'),()=>pickMode('char','dummy'));
    chars.forEach((sp,k)=>slot(headImg(sp,'n'),String(sp.name).slice(0,9),is('char',String(k)),()=>{ if(is('char',String(k))){ openMaker(k); return; } pickMode('char',String(k)); toast(`Tap to drop ${sp.name}. Tap the button again to change them.`); }));
    if(lastRandom) slot(icon('keep'),'Keep',false,()=>{ chars.push({...lastRandom}); saveChars(); toast(`${lastRandom.name} is saved in People!`); lastRandom=null; sfx('fanfare'); buildSlots(); });
    slot(icon('new'),'New',false,()=>openMaker(-1));
  } else if(tab==='things'){
    ITEMS.forEach(k=>slot(itemImg(k,0.95),INAME[k],is('item',k),()=>pickMode('item',k)));
  } else TOOLS.forEach(([k,n])=>slot(icon(k),n,is('tool',k),()=>pickMode('tool',k)));
}
function pickMode(kind,id){ mode={kind,id}; sfx('click'); if(kind==='tool') toast(HINTS[id]); else if(kind==='item') toast(`Tap the screen to drop a ${INAME[id].toLowerCase()}`); else if(id==='random') toast("Tap the screen: a new friend every time!"); else if(id==='dummy') toast("Tap the screen to drop a dummy"); buildSlots(); }
document.querySelectorAll('#tabs .pb').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; sfx('click'); buildSlots(); slotsEl.scrollLeft=0; });
const bSound=document.getElementById('bSound');
bSound.onclick=()=>{ muted=!muted; bSound.textContent=muted?'Sound: off':'Sound: on'; bSound.classList.toggle('on',muted); };
document.getElementById('bClear').onclick=()=>{ clearAll(); toast('Scene cleared'); };
document.querySelectorAll('.sheet').forEach(sh=>sh.addEventListener('click',e=>{ if(e.target===sh||e.target.closest('[data-close]')) sh.classList.remove('show'); }));
// stage sheet
const stageList=document.getElementById('stageList');
STAGES.forEach(([id,name],i)=>{ const b=document.createElement('button'); b.className='pb'; const im=document.createElement('img'); im.alt=''; im.src=background(id,30,20,15).toDataURL(); b.appendChild(im); b.appendChild(document.createTextNode(name)); b.onclick=()=>{ setStage(i); document.getElementById('stageSheet').classList.remove('show'); }; stageList.appendChild(b); });
document.getElementById('bStage').onclick=()=>{ document.getElementById('stageSheet').classList.add('show'); sfx('click'); };
// maker
const ROWS=[["Skin","skin",SKINS,1],["Hair","hair",HAIRS,0],["Hair colour","hair_col",HAIR_COLS,1],["Top","top",TOPS,0],["Top colour","top_col",CLOTH,1],["Second colour","top_col2",CLOTH,1],["Sleeves","sleeves",SLEEVES,0],["Bottom","bottom",BOTTOMS,0],["Bottom colour","bot_col",CLOTH,1],["Shoes","shoe_col",SHOES,1],["Size","size",SIZES,0]];
let mkSpec=null, mkIndex=-1;
const mkPrev=document.getElementById('mkPrev'), mkName=document.getElementById('mkName'), mkOpts=document.getElementById('mkOpts');
mkName.oninput=()=>{ mkSpec.name=mkName.value; };
function openMaker(k){ mkIndex=k; mkSpec=k>=0?{...chars[k]}:randomSpec(); document.getElementById('mkDelete').style.display=k>=0?'':'none'; document.getElementById('makerSheet').classList.add('show'); renderMaker(); sfx('click'); }
function renderMaker(){
  mkName.value=mkSpec.name; const px=mkPrev.getContext('2d'); px.imageSmoothingEnabled=false; px.clearRect(0,0,16,31); px.drawImage(fullImg(mkSpec),0,0);
  mkOpts.innerHTML='';
  ROWS.forEach(([label,key,list,isCol])=>{ const row=document.createElement('div'); row.className='row';
    const l=document.createElement('label'); l.textContent=label; row.appendChild(l);
    const prev=document.createElement('button'); prev.className='pb'; prev.textContent='<'; prev.setAttribute('aria-label',`Previous ${label}`); row.appendChild(prev);
    const val=document.createElement('div'); val.className='val'; const v=mkSpec[key];
    if(isCol) val.style.background=v; else val.textContent=key==='size'?({0.75:'Small',1:'Normal',1.35:'Big'}[v]||v):String(v).charAt(0).toUpperCase()+String(v).slice(1);
    row.appendChild(val);
    const next=document.createElement('button'); next.className='pb'; next.textContent='>'; next.setAttribute('aria-label',`Next ${label}`); row.appendChild(next);
    const cyc=d=>{ let i=list.indexOf(mkSpec[key]); i=(i+d+list.length)%list.length; mkSpec[key]=list[i]; sfx('click'); renderMaker(); };
    prev.onclick=()=>cyc(-1); next.onclick=()=>cyc(1); mkOpts.appendChild(row); });
}
document.getElementById('mkRandom').onclick=()=>{ const nm=mkSpec.name; mkSpec=randomSpec(); if(mkIndex>=0) mkSpec.name=nm; sfx('magic'); renderMaker(); };
document.getElementById('mkDelete').onclick=()=>{ if(mkIndex<0) return; chars.splice(mkIndex,1); saveChars(); mode={kind:'char',id:'random'}; document.getElementById('makerSheet').classList.remove('show'); buildSlots(); toast('Character deleted'); };
document.getElementById('mkSave').onclick=()=>{ mkSpec.name=(mkSpec.name||'').trim()||pick(NAMES); if(mkIndex>=0){ chars[mkIndex]={...mkSpec}; mode={kind:'char',id:String(mkIndex)}; } else { chars.push({...mkSpec}); mode={kind:'char',id:String(chars.length-1)}; } saveChars(); document.getElementById('makerSheet').classList.remove('show'); tab='people'; buildSlots(); sfx('fanfare'); toast(`Tap the screen to drop ${mkSpec.name}!`); };

// ============ start ============
resize(); setStage(0,true); buildSlots(); startScene(); requestAnimationFrame(frame);
setTimeout(()=>toast("Pick something below, then tap the screen!"),300);
window.__ms={engine,rags,makeRag,pullMachine,get W(){return W;},get groundY(){return groundY;},setStage,openMaker};
})();
</script>
</body>
