name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot templates and editor settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: timeout 300 godot --headless --import || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/signing/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android" build/MatthewsSandbox.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: matthews-sandbox-godot-apk
          path: build/MatthewsSandbox.apk

      - name: Publish to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Matthew's Sandbox (Godot) - latest APK"
          body: "Built automatically from the newest commit. Download MatthewsSandbox.apk below and open it on your phone."
          files: build/MatthewsSandbox.apk
          make_latest: true
